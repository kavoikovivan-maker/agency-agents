services:
  agency:
    build:
      context: ..
      dockerfile: platform/Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - APP_DATA_DIR=/data
      - MODEL_PROVIDER=${MODEL_PROVIDER:-mock}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - APP_PASSWORD=${APP_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-20}
      - MAX_AGENTS_PER_TASK=${MAX_AGENTS_PER_TASK:-6}
      - PROVIDER_TIMEOUT_SECONDS=${PROVIDER_TIMEOUT_SECONDS:-60}
      - PROVIDER_MAX_RETRIES=${PROVIDER_MAX_RETRIES:-2}
    volumes:
      - agency-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  agency-data:
